name: 更新并部署 虚拟币监控台

on:
  schedule:
    - cron: '*/5 * * * *'    # 每 5 分钟自动运行一次（UTC 时间）
  workflow_dispatch:          # 允许在 Actions 页面手动点击运行
  push:
    branches: [ main ]        # 每次有改动推送到 main 也会更新

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行抓取脚本生成 index.html
        shell: pwsh
        run: ./crypto-notice.ps1

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包网站文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
