name: 更新并部署 虚拟币监控台

on:
  schedule:
    - cron: '*/5 * * * *'    # 每 5 分钟自动运行一次（UTC 时间）
  workflow_dispatch:          # 允许在 Actions 页面手动点击运行
  repository_dispatch:        # 允许外部定时服务（如 cron-job.org）准时触发
    types: [tick]
  push:
    branches: [ main ]        # 每次有改动推送到 main 也会更新

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # 不中途取消：避免消息已推送但记录还没保存就被打断

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行抓取脚本生成 index.html
        shell: pwsh
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: ./crypto-notice.ps1

      - name: 保存推送记录
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          # 逐个添加：任一文件不存在时，合在一起的 git add 会整条失败、什么都不保存
          for f in pushed.txt chainlog.txt lastreport.txt; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "update pushed list [skip ci]" 2>/dev/null || true
          git push 2>/dev/null || true

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包网站文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
